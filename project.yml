name: Time Strip

options:
  bundleIdPrefix: com.mlkshkvch.time-strip
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  # Sets LastUpgradeCheck, so Xcode stops offering its "recommended settings" upgrade. Those
  # settings live in this file instead: the generated project is overwritten on every generate.
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    # CLI/CI builds pass CODE_SIGNING_ALLOWED=NO. For running the app + widget locally the bundles
    # must be Team-signed (ad-hoc widgets don't register with macOS's widget daemon). The Team ID
    # is not committed: it comes from .env through Config/Local.xcconfig (see `make local-config`).
    CODE_SIGN_STYLE: Automatic

targets:

  # ── UI-free core: models + time / formatting engines + city catalog ────────
  # NO SwiftUI / WidgetKit / AppKit imports in Sources/Kit.
  TimeStripKit:
    type: framework
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources/Kit
        excludes:
          - "Resources/**"
      # The city table generated by `make cities`.
      - path: Sources/Kit/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip.kit
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        ENABLE_MODULE_VERIFIER: "YES"

  # ── Shared SwiftUI views (ribbon, palette, fixtures) ───────────────────────
  # Extracted from the widget so macOS can host canvas previews (widget-extension
  # targets can't be previewed on macOS). Imports TimeStripKit; used by app + widget.
  TimeStripUI:
    type: framework
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/UI
    dependencies:
      - target: TimeStripKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip.ui
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        ENABLE_MODULE_VERIFIER: "YES"

  # ── Minimal host app (onboarding window); embeds the widget extension ──────
  Time Strip:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/App
    dependencies:
      - target: TimeStripKit
      - target: TimeStripUI
      - target: TimeStripWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Time Strip
        INFOPLIST_KEY_LSUIElement: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Emil Kashkevich · MIT License"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # The app uses no encryption, so App Store Connect does not ask the export-compliance
        # questions on each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # macOS requires WidgetKit extensions to be sandboxed, and an extension's sandbox must be
        # matched by its container app. (No sandbox = the widget never registers with chronod.)
        # iOS sandboxes every app, so the entitlement is macOS-only.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": "YES"
        # A multiplatform target gets the iOS runpath; a macOS app keeps frameworks in
        # Contents/Frameworks, one level above the executable.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
      configs:
        # The dev app. Its own bundle ID keeps its container, widget and install apart from the
        # App Store app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip.dev
          VERSION_SUFFIX: -dev
          # The generated Info.plist takes CFBundleShortVersionString from MARKETING_VERSION only.
          MARKETING_VERSION: "$(inherited)$(VERSION_SUFFIX)"
          # Rendered from AppIcon by Scripts/make-dev-icon.swift.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
    # Release is the App Store app, and only an Xcode archive builds it.
    preBuildScripts:
      - name: Release builds only by archive
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = Release ] && [ "$ACTION" != install ]; then
            echo "error: Release is the App Store app and builds only by Product ▸ Archive. Use Debug."
            exit 1
          fi

  # ── WidgetKit extension: views, timeline provider, configuration intent ────
  TimeStripWidget:
    type: app-extension
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/Widget
    dependencies:
      - target: TimeStripKit
      - target: TimeStripUI
      # Explicit link so appintentsmetadataprocessor extracts the WidgetConfigurationIntent
      # metadata WidgetKit reads to render the native Edit-Widget picker.
      - sdk: AppIntents.framework
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Time Strip
        # XcodeGen otherwise writes a fixed 1.0 (1); the extension must match its container app.
        CFBundleShortVersionString: $(MARKETING_VERSION)$(VERSION_SUFFIX)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip.widget
        # Mandatory for a macOS widget extension — without the App Sandbox entitlement the
        # system won't load it into the widget gallery.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": "YES"
        # The macOS appex sits in Contents/PlugIns; its frameworks are the container app's.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
      configs:
        # An extension's bundle ID must start with its app's, and its version must match.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip.dev.widget
          VERSION_SUFFIX: -dev

  # ── Unit tests for the core. Not app-hosted → runner isn't sandboxed, so it
  #    can read fixtures directly. @testable import TimeStripKit. ─────────────
  TimeStripTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "UI/**"      # UI/ is its own target (it @needs TimeStripUI, not just Kit)
    dependencies:
      - target: TimeStripKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # ── Unit tests for the SwiftUI layer (public layout math). ─────────────────
  TimeStripUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UI
    dependencies:
      - target: TimeStripUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.time-strip.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Time Strip:
    build:
      targets:
        TimeStripKit: all
        TimeStripUI: all
        TimeStripWidget: all
        Time Strip: [run, profile, archive, analyze]  # app not built during `test` → no signing to run tests
    # Only archive builds Release; every other action builds the dev app.
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeStripTests
        - TimeStripUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
